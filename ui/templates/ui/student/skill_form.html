{% extends 'ui/base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ page_title }}</h1>

        <form method="post" novalidate>
            {% csrf_token %}

            {% for field in form %}
            <div class="mb-4">
                <label for="{{ field.id_for_label }}" class="block text-gray-700 font-semibold mb-2">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <p class="text-sm text-gray-500 mt-1">{{ field.help_text }}</p>
                {% endif %}
                {% for error in field.errors %}
                    <p class="text-red-500 text-sm mt-1">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <div class="flex items-center justify-end mt-6 space-x-4">
                <a href="{% url 'my_skills' %}" class="text-gray-600 hover:underline">Cancel</a>
                <button type="submit" class="bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-blue-700 transition duration-200">
                    {% if form.instance.pk %}
                        Save Changes
                    {% else %}
                        Create Skill
                    {% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
