{% extends 'ui/base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-lg">
    <div class="bg-white p-8 rounded-lg shadow-md text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Confirm Deletion</h1>
        <p class="text-gray-700 mb-6">
            Are you sure you want to delete the skill: <strong>"{{ skill.title }}"</strong>?
        </p>
        <p class="text-red-600 font-semibold mb-6">This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div class="flex items-center justify-center space-x-4">
                <a href="{% url 'my_skills' %}" class="bg-gray-200 text-gray-800 font-semibold py-2 px-6 rounded-lg hover:bg-gray-300 transition duration-200">
                    Cancel
                </a>
                <button type="submit" class="bg-red-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-red-700 transition duration-200">
                    Yes, Delete
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
