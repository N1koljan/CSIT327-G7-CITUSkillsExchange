{% extends 'ui/base.html' %}
{% block content %}
<div style="max-width: 500px; margin: 80px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;">
    <h2 style="color: #27ae60; margin-bottom: 20px;">Password Changed!</h2>
    <p>Your password has been set. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" style="display: inline-block; margin-top: 20px; padding: 12px 30px; background: #800000; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">Go to Login</a>
</div>
{% endblock %}
